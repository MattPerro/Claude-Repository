<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover per usare tutta l'area schermo iPhone (safe-area insets) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FBFAF7" />
<title>David — il tuo percorso a nuoto</title>

<!-- Aggiungi alla Home su iPhone: resa a schermo intero -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="David" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Nessuna risorsa esterna: si usano solo font di sistema (privacy: zero chiamate di rete). -->

<style>
/* =========================================================================
   DAVID — App personale di nuoto (file unico, vanilla, offline-first)
   Sezioni CSS: 1) token  2) base/layout  3) componenti  4) tab  5) sheet
                6) animazioni SVG  7) grafici/figure  8) accessibilità
   ========================================================================= */

/* --- 1) Token design system: identità "marmo/bronzo" --- */
:root{
  --stone:#EEEBE4; --marble:#FBFAF7; --marble-2:#F1EDE6;
  --ink:#1C1B19; --ink-soft:#6E685F;
  --line:#E5E0D6; --line-2:#D7D0C3;
  --bronze:#8C6239; --bronze-soft:#C8A37A;
  --verde:#5C7150;  /* fatto / sicuro */
  --rosso:#A03A2C;  /* vietato / ernie */
  --acqua:#6E9BB4;  /* acqua */
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(28,27,25,.10);
  --font-display:"Fraunces", ui-serif, Georgia, "Times New Roman", serif;
  --font-text:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --tabbar-h:64px;
}

/* --- 2) Base & layout --- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-text);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--marble) 0%, var(--stone) 60%, var(--marble-2) 100%);
  background-attachment:fixed;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{
  max-width:520px; margin:0 auto;
  padding:
    calc(env(safe-area-inset-top) + 8px)
    16px
    calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px)
    16px;
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.2px;margin:0;}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;}
p{margin:.4em 0;}
button{font-family:inherit;cursor:pointer;}
.muted{color:var(--ink-soft);}
.small{font-size:.82rem;}
.center{text-align:center;}
.hidden{display:none !important;}

/* header brand */
.brand{display:flex;align-items:baseline;gap:8px;margin:4px 2px 14px;}
.brand h1{font-size:1.5rem;}
.brand .sub{color:var(--ink-soft);font-size:.8rem;}

/* --- 3) Componenti riutilizzabili --- */
.card{
  background:var(--marble);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card.tight{padding:14px;}
.hero{
  background:linear-gradient(155deg,#26251F 0%, #1C1B19 60%, #17160F 100%);
  color:#F3EFE7; border:none;
  position:relative; overflow:hidden;
}
.hero:before{ /* venatura di marmo/bronzo */
  content:""; position:absolute; inset:0;
  background:radial-gradient(400px 200px at 120% -20%, rgba(200,163,122,.25), transparent 60%);
  pointer-events:none;
}
.hero h2{color:#F6F2EA;font-size:1.35rem;}
.hero .focus{color:#D9CEBE;font-size:.9rem;margin-top:6px;}
.hero .meta{color:var(--bronze-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:600;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:12px 18px;border-radius:14px;border:1px solid transparent;
  font-weight:600;font-size:.98rem;width:100%;
}
.btn-primary{background:var(--bronze);color:#fff;}
.btn-primary:active{background:#7a5530;}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink);}
.btn-on-dark{background:rgba(255,255,255,.12);color:#F3EFE7;border:1px solid rgba(255,255,255,.22);}
.btn-danger{background:transparent;border:1px solid var(--rosso);color:var(--rosso);}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{width:auto;flex:1;}
.btn.sm{min-height:38px;padding:8px 12px;font-size:.86rem;width:auto;}

.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.72rem;
  padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px;}
.tag-A{background:rgba(110,155,180,.16);color:#3f6d86;}
.tag-B{background:rgba(140,98,57,.16);color:var(--bronze);}
.tag-C{background:rgba(92,113,80,.18);color:var(--verde);}
.tag-R{background:var(--stone);color:var(--ink-soft);}

.pill{display:inline-block;font-size:.72rem;font-weight:600;color:var(--ink-soft);
  background:var(--stone);border-radius:999px;padding:3px 10px;}

/* card di avviso ernie */
.warn{
  border:1px solid rgba(160,58,44,.35);
  background:rgba(160,58,44,.06);
  border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0;
}
.warn h3{color:var(--rosso);font-size:.95rem;display:flex;align-items:center;gap:8px;}
.warn ul{margin:8px 0 0;padding-left:18px;}
.warn li{margin:3px 0;font-size:.88rem;}
.honesty{font-size:.78rem;color:var(--ink-soft);font-style:italic;
  border-left:3px solid var(--bronze-soft);padding-left:10px;margin-top:10px;}

/* striscia settimana */
.weekstrip{display:flex;justify-content:space-between;gap:4px;margin-top:6px;}
.weekstrip .d{flex:1;text-align:center;padding:8px 0 6px;border-radius:12px;position:relative;}
.weekstrip .d.today{background:var(--stone);}
.weekstrip .d .lbl{font-size:.66rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
.weekstrip .d .dot{width:9px;height:9px;border-radius:50%;margin:6px auto 0;background:var(--line-2);}
.weekstrip .d .dot.plan{background:var(--bronze-soft);}
.weekstrip .d .dot.done{background:var(--verde);}
.weekstrip .d .dot.rest{background:transparent;border:1px dashed var(--line-2);}

/* mini-stat */
.stats{display:flex;gap:10px;}
.stat{flex:1;background:var(--marble);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px;text-align:center;}
.stat .v{font-family:var(--font-display);font-size:1.5rem;line-height:1;}
.stat .k{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}

/* --- 4) Tab bar in basso --- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(251,250,247,.92);
  backdrop-filter:saturate(1.2) blur(10px);
  -webkit-backdrop-filter:saturate(1.2) blur(10px);
  border-top:1px solid var(--line);
  display:flex;
}
#tabbar button{
  flex:1;background:none;border:none;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:.68rem;font-weight:600;min-height:44px;
}
#tabbar button .ic{width:24px;height:24px;display:block;}
#tabbar button[aria-current="page"]{color:var(--bronze);}
#tabbar button[aria-current="page"] .ic{stroke:var(--bronze);}

.tabview{display:none;}
.tabview.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* --- 5) Bottom sheet (anteprima + animazioni, impilabili) --- */
.sheet-scrim{position:fixed;inset:0;background:rgba(28,27,25,.42);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .2s ease;}
.sheet-scrim.open{pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;
  max-width:520px;margin:0 auto;
  background:var(--marble);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(28,27,25,.22);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  max-height:90vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{transform:translateY(0);}
.sheet-scrim.open{opacity:1;}
#animScrim{z-index:60;} #animSheet{z-index:61;}   /* clip animate sopra l'anteprima */
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 4px;flex:none;}
.sheet .sheet-head{padding:6px 18px 10px;border-bottom:1px solid var(--line);flex:none;}
.sheet .sheet-head h2{font-size:1.15rem;}
.sheet .sheet-head .sub{color:var(--ink-soft);font-size:.85rem;margin-top:2px;}
.sheet .sheet-body{padding:14px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet .sheet-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;}
.sheet-close{position:absolute;top:12px;right:14px;background:var(--stone);border:none;
  width:34px;height:34px;border-radius:50%;font-size:1.1rem;color:var(--ink-soft);line-height:1;}
body.locked{overflow:hidden;}

/* segmented control (Riposo/A/B/C, e A/B/C sessione) */
.seg{display:flex;background:var(--stone);border-radius:12px;padding:4px;gap:4px;}
.seg button{flex:1;border:none;background:none;padding:9px 4px;border-radius:9px;
  font-weight:600;font-size:.86rem;color:var(--ink-soft);min-height:40px;}
.seg button[aria-pressed="true"]{background:var(--marble);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* blocchi esercizi */
.block{margin-top:16px;}
.block h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--bronze);margin-bottom:6px;}
.exlist{list-style:none;margin:0;padding:0;}
.ex{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.ex:last-child{border-bottom:none;}
.ex .check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line-2);
  background:var(--marble);margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;}
.ex .check[aria-checked="true"]{background:var(--verde);border-color:var(--verde);}
.ex .body{flex:1;min-width:0;}
.ex .name{font-weight:600;}
.ex .schema{color:var(--ink-soft);font-size:.85rem;}
.ex .cues{margin:6px 0 0;padding-left:16px;}
.ex .cues li{font-size:.82rem;color:var(--ink-soft);margin:2px 0;}
.ex .cues li.contra{color:var(--rosso);font-weight:600;list-style:none;margin-left:-16px;}
.ex .play{margin-top:8px;}
.equip{font-size:.72rem;color:var(--verde);font-weight:600;}

/* Piano: righe giorno */
.daycard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);margin-bottom:8px;background:var(--marble);}
.daycard .dinfo{flex:1;min-width:0;}
.daycard .dname{font-weight:600;font-size:.92rem;}
.daycard .dsess{margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.daycard .assign{color:var(--bronze);font-weight:600;font-size:.86rem;background:none;border:none;padding:0;}
.daycard .docircle{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);
  background:none;color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.daycard .docircle[aria-checked="true"]{background:var(--verde);border-color:var(--verde);}
.daycard.is-today{border-color:var(--bronze-soft);box-shadow:0 0 0 2px rgba(200,163,122,.25);}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.weeknav button{background:var(--stone);border:none;width:40px;height:40px;border-radius:12px;font-size:1.2rem;color:var(--ink);}
.weeknav .range{font-weight:600;font-family:var(--font-display);}

/* input */
.field{margin:10px 0;}
.field label{display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:12px;
  font-family:inherit;font-size:1rem;background:var(--marble);color:var(--ink);}
.inline-fields{display:flex;gap:10px;}
.inline-fields .field{flex:1;}

/* --- 6) Animazioni SVG (clip di esecuzione) --- */
.anim-stage{--mult:1;background:linear-gradient(180deg,#EAF1F4 0%,#DCE8ED 100%);
  border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;}
.anim-stage.dry{background:linear-gradient(180deg,#F3EFE7 0%,#EBE5DA 100%);}
.anim-stage svg{display:block;width:100%;height:auto;}
.waterline{fill:rgba(110,155,180,.18);}
.fig{fill:none;stroke:#2b2a26;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
.fig.limb{stroke-width:5.5;}
.fig.body{stroke-width:11;stroke:#33322c;}
.skin{fill:#33322c;stroke:none;}
.acc{stroke:var(--acqua);}
.j{transform-box:view-box;}
@keyframes windmill{to{transform:rotate(360deg);}}
@keyframes windmillRev{to{transform:rotate(-360deg);}}
@keyframes flutter{0%,100%{transform:rotate(14deg);}50%{transform:rotate(-14deg);}}
@keyframes flutterAlt{0%,100%{transform:rotate(-14deg);}50%{transform:rotate(14deg);}}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes scull{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(20deg);}}
@keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
@keyframes slideBack{0%,100%{transform:translateX(0);}45%{transform:translateX(-10px);}}
@keyframes torsoOpen{0%,100%{transform:rotate(0);}50%{transform:rotate(-24deg);}}
.a-windmill{animation:windmill calc(var(--d,1.6s)*var(--mult)) linear infinite;}
.a-windmill-rev{animation:windmillRev calc(var(--d,1.6s)*var(--mult)) linear infinite;}
.a-flutter{animation:flutter calc(var(--d,.5s)*var(--mult)) ease-in-out infinite;}
.a-flutter-alt{animation:flutterAlt calc(var(--d,.5s)*var(--mult)) ease-in-out infinite;}
.a-bob{animation:bob calc(var(--d,2.4s)*var(--mult)) ease-in-out infinite;}
.a-scull{animation:scull calc(var(--d,1.1s)*var(--mult)) ease-in-out infinite;}
.a-sway{animation:sway calc(var(--d,2.2s)*var(--mult)) ease-in-out infinite;}
.a-slideback{animation:slideBack calc(var(--d,2.4s)*var(--mult)) ease-in-out infinite;}
.a-torso{animation:torsoOpen calc(var(--d,3s)*var(--mult)) ease-in-out infinite;}
.slowbtn{margin-top:2px;}

/* cue list nell'anim sheet */
.cuebox{margin:0;padding:0;list-style:none;}
.cuebox li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.9rem;}
.cuebox li:before{content:"•";color:var(--bronze);font-weight:700;}
.cuebox li.contra{color:var(--rosso);font-weight:600;}
.cuebox li.contra:before{content:"✗";color:var(--rosso);}

/* --- 7) Grafici & figura David --- */
.chartwrap{background:var(--marble);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;}
.chartwrap svg{display:block;width:100%;height:auto;}
.bigweight{font-family:var(--font-display);font-size:2.6rem;line-height:1;}
.delta{font-weight:600;}
.delta.pos{color:var(--verde);} .delta.neg{color:var(--bronze);}
.david-stage{background:linear-gradient(180deg,#F4F1EA 0%,#E9E3D7 100%);border-radius:var(--radius-sm);padding:8px 8px 0;}
.david-trio{display:flex;justify-content:space-around;gap:6px;margin-bottom:8px;}
.david-trio figure{margin:0;text-align:center;flex:1;}
.david-trio svg{width:100%;height:auto;max-height:120px;}
.david-trio figcaption{font-size:.68rem;color:var(--ink-soft);margin-top:2px;}
.david-main svg{width:60%;display:block;margin:0 auto;max-height:230px;}
.davfill{fill:#C9C3B6;}
input[type=range]{width:100%;accent-color:var(--bronze);height:36px;}
.readout{display:flex;justify-content:space-around;text-align:center;margin:8px 0;}
.readout .v{font-family:var(--font-display);font-size:1.3rem;}
.readout .k{font-size:.7rem;color:var(--ink-soft);}
.stagecap{text-align:center;font-family:var(--font-display);font-size:1rem;margin:4px 0 2px;}

/* --- 8) Accessibilità: rispetta prefers-reduced-motion --- */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important;}
  .anim-stage *{animation:none !important;}
  .tabview.active{animation:none;}
}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>
<div id="app">
  <header class="brand">
    <h1>David</h1>
    <span class="sub">dal blocco alla forma — a nuoto</span>
  </header>

  <!-- 4 viste (tab) -->
  <section id="view-oggi" class="tabview active" aria-label="Oggi"></section>
  <section id="view-piano" class="tabview" aria-label="Piano"></section>
  <section id="view-sessione" class="tabview" aria-label="Sessione"></section>
  <section id="view-progressi" class="tabview" aria-label="Progressi"></section>
</div>

<!-- Bottom navigation -->
<nav id="tabbar" aria-label="Navigazione principale">
  <button data-tab="oggi" aria-current="page">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
    Oggi
  </button>
  <button data-tab="piano">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    Piano
  </button>
  <button data-tab="sessione">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16c2 0 2-1.5 4-1.5S8 16 10 16s2-1.5 4-1.5S16 16 18 16s2-1.5 4-1.5"/><path d="M2 20c2 0 2-1.5 4-1.5S8 20 10 20s2-1.5 4-1.5S16 20 18 20s2-1.5 4-1.5"/><circle cx="15" cy="7" r="2"/></svg>
    Sessione
  </button>
  <button data-tab="progressi">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 16l3.5-4 3 2.5L20 8"/></svg>
    Progressi
  </button>
</nav>

<!-- Sheet: Anteprima seduta -->
<div id="prevScrim" class="sheet-scrim" data-close="prev"></div>
<div id="prevSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="prevTitle">
  <button class="sheet-close" data-close="prev" aria-label="Chiudi">✕</button>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="prevTitle">Seduta</h2>
    <div class="sub" id="prevSub"></div>
  </div>
  <div class="sheet-body" id="prevBody"></div>
  <div class="sheet-foot" id="prevFoot"></div>
</div>

<!-- Sheet: Clip animata (sopra l'anteprima) -->
<div id="animScrim" class="sheet-scrim" data-close="anim"></div>
<div id="animSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="animTitle">
  <button class="sheet-close" data-close="anim" aria-label="Chiudi">✕</button>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="animTitle">Esecuzione</h2>
    <div class="sub" id="animSub"></div>
  </div>
  <div class="sheet-body" id="animBody"></div>
</div>

<script>
/* =========================================================================
   DAVID — logica applicativa (vanilla JS)
   Sezioni: 1) storage  2) dati dominio  3) date  4) logica  5) .ics
            6) nav  7) render Oggi/Piano/Sessione/Progressi
            8) anteprima  9) animazioni  10) figura David  11) init
   ========================================================================= */
"use strict";

/* ---------- 1) STORAGE: localStorage con fallback in memoria ---------- */
var SCHEMA = 1;
var store = (function(){
  var mem = {}, ok = true;
  try { var t="__david_t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); }
  catch(e){ ok = false; }               // storage bloccato → si usa la memoria
  return {
    available: ok,
    get:function(k,def){
      try{
        if(ok){ var v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }
        return (k in mem)?mem[k]:def;
      }catch(e){ return def; }
    },
    set:function(k,v){
      try{ if(ok) localStorage.setItem(k,JSON.stringify(v)); else mem[k]=v; }
      catch(e){ mem[k]=v; }
    },
    del:function(k){
      try{ if(ok) localStorage.removeItem(k); else delete mem[k]; }catch(e){}
    }
  };
})();

var KEYS = {
  settings:"david.settings", pattern:"david.pattern", done:"david.done",
  exchecks:"david.exchecks", weights:"david.weights"
};
var settings, pattern, done, exchecks, weights;

function loadState(){

/* ---------- 3) DATE: helper DST-safe (componenti locali, no aritmetica su ms) ---------- */
var GIORNI = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
var GIORNI_LONG = ["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
var MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function pad2(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){ var p=s.split("-"); return new Date(+p[0],(+p[1])-1,+p[2]); }
function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); } // DST-safe
function weekdayMon(d){ return (d.getDay()+6)%7; }        // 0=Lun … 6=Dom
function mondayOf(d){ return addDays(d, -weekdayMon(d)); }
function fmtShort(d){ return d.getDate()+" "+MESI[d.getMonth()]; }
function fmtRange(a,b){
  if(a.getMonth()===b.getMonth()) return a.getDate()+"–"+b.getDate()+" "+MESI[a.getMonth()];
  return fmtShort(a)+" – "+fmtShort(b);
}

/* ---------- 4) LOGICA ---------- */
function sessTypeForDate(d){ return pattern[weekdayMon(d)]; }   // "A"/"B"/"C" o undefined (riposo)
function isDone(isoStr){ return !!done[isoStr]; }
function toggleDone(isoStr, tipo){
  if(!tipo) return;
  if(done[isoStr]===tipo) delete done[isoStr]; else done[isoStr]=tipo;
  saveDone();
}
function exKey(isoStr,tipo){ return isoStr+"_"+tipo; }
function isExChecked(isoStr,tipo,exId){ var m=exchecks[exKey(isoStr,tipo)]; return !!(m&&m[exId]); }
function toggleEx(isoStr,tipo,exId){
  var k=exKey(isoStr,tipo); if(!exchecks[k]) exchecks[k]={};
  if(exchecks[k][exId]) delete exchecks[k][exId]; else exchecks[k][exId]=true;
  saveExchecks();
}
// conteggio sedute fatte in una settimana (lunedì della settimana passato come base)
function doneCountInWeek(mon){
  var c=0; for(var i=0;i<7;i++){ if(done[iso(addDays(mon,i))]) c++; } return c;
}
function plannedCountInWeek(mon){
  var c=0; for(var i=0;i<7;i++){ if(pattern[weekdayMon(addDays(mon,i))]) c++; } return c;
}
// streak: settimane consecutive con ≥2 sedute (la corrente conta solo se già ≥2)
function streakWeeks(){
  var streak=0, base=mondayOf(today()), i=0;
  while(i<520){
    var cnt=doneCountInWeek(addDays(base,-7*i));
    if(i===0){ if(cnt>=2) streak++; }     // settimana corrente: conta solo se ≥2
    else { if(cnt>=2) streak++; else break; }
    i++;
  }
  return streak;
}
// aderenza %: fatte / pianificate nelle ultime 4 settimane (28 giorni fino a oggi)
function adherence(){
  var t=today(), planned=0, doneN=0;
  for(var i=0;i<28;i++){
    var d=addDays(t,-i), s=iso(d);
    if(pattern[weekdayMon(d)]) planned++;
    if(done[s]) doneN++;
  }
  if(planned===0) return 0;
  return Math.min(100, Math.round(doneN/planned*100));
}
function currentWeight(){ return weights.length? weights[weights.length-1].kg : settings.startW; }

/* ---------- 5) EXPORT .ics (prossime 4 settimane, VALARM la sera prima) ---------- */
function icsDate(d,hhmm){ var p=hhmm.split(":"); // floating local time
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"T"+pad2(+p[0])+pad2(+p[1])+"00"; }
function buildICS(){
  var lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//David//Nuoto//IT","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  var start=today(), stamp=icsDate(new Date(),(pad2(new Date().getHours())+":"+pad2(new Date().getMinutes())));
  for(var i=0;i<28;i++){
    var d=addDays(start,i), tipo=sessTypeForDate(d);
    if(!tipo) continue;
    var s=SESS[tipo];
    var dtstart=icsDate(d,settings.sessTime);
    // fine sessione: +60 minuti (gestione ora limite con Date locale)
    var pt=settings.sessTime.split(":"), endD=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+pt[0],+pt[1]+60);
    var dtend=endD.getFullYear()+pad2(endD.getMonth()+1)+pad2(endD.getDate())+"T"+pad2(endD.getHours())+pad2(endD.getMinutes())+"00";
    var alarm=icsDate(addDays(d,-1),settings.remTime);   // sera prima, orario avviso
    lines.push("BEGIN:VEVENT");
    lines.push("UID:"+iso(d)+"-"+tipo+"@david");
    lines.push("DTSTAMP:"+stamp);
    lines.push("DTSTART:"+dtstart);
    lines.push("DTEND:"+dtend);
    lines.push("SUMMARY:🏊 Nuoto — "+TIPO_LABEL[tipo]+": "+s.name);
    lines.push("DESCRIPTION:"+s.focus.replace(/,/g,"\\,")+" ("+s.dur+")");
    lines.push("BEGIN:VALARM");
    lines.push("ACTION:DISPLAY");
    lines.push("DESCRIPTION:Prepara la borsa: domani "+TIPO_LABEL[tipo]+" 🏊");
    lines.push("TRIGGER;VALUE=DATE-TIME:"+alarm);
    lines.push("END:VALARM");
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadFile(name, mime, text){
  var blob=new Blob([text],{type:mime});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
}

var activeTab="oggi";

function setTab(name){
  activeTab=name;
  ["oggi","piano","sessione","progressi"].forEach(function(t){
    document.getElementById("view-"+t).classList.toggle("active", t===name);
  });
  document.querySelectorAll("#tabbar button").forEach(function(b){
    if(b.dataset.tab===name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  renderTab(name);
  window.scrollTo(0,0);
}
function renderTab(name){
  if(name==="oggi") renderOggi();
  else if(name==="piano") renderPiano();
  else if(name==="sessione") renderSessione();
  else if(name==="progressi") renderProgressi();
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

      + '<h2>Giorno di recupero</h2>'
      + '<div class="focus">Riposa: il progresso si costruisce anche fuori dall\'acqua.</div>';

  var doneThis=doneCountInWeek(mon), planThis=plannedCountInWeek(mon);

    + '<div class="stat"><div class="v num">'+doneThis+'/'+planThis+'</div><div class="k">sedute questa settimana</div></div>'
    + '<div class="stat"><div class="v num">'+streakWeeks()+'</div><div class="k">settimane di fila (≥2)</div></div>'
    + '</div>';

}

  var tipo=sessionType, s=SESS[tipo];

  var html='<div class="seg" role="tablist" aria-label="Scegli sessione">';
  TIPI.forEach(function(x){
    html+='<button role="tab" aria-pressed="'+(x===tipo?"true":"false")+'" data-act="segSess" data-tipo="'+x+'">'+x+'</button>';
  });
  html+='</div>';

  html+='<div class="card" style="margin-top:14px"><div class="pill">'+TIPO_LABEL[tipo]+' · '+s.dur+'</div>'
    + '<h2 style="margin-top:8px">'+esc(s.name)+'</h2>'
    + '<p class="muted small">'+esc(s.focus)+'</p></div>';

  // Avviso ernie (sempre presente in Sessione)
  html+=herniaCard();

  // Blocchi + esercizi con checkbox per data+tipo (oggi)
  var total=0, checked=0;
  s.blocks.forEach(function(bl){
    html+='<div class="card"><div class="block" style="margin-top:0"><h3>'+esc(bl.title)+'</h3><ul class="exlist">';
    bl.items.forEach(function(it){
      total++;
      var ex=EX[it.ref], on=isExChecked(isoT,tipo,it.id);

    });
    html+='</ul></div></div>';
  });

  v.innerHTML=html;

  // barra sticky in fondo (X/N + completa)
  renderSessSticky(isoT,tipo,checked,total);
}

  return '<li class="ex">'
    + '<button class="check" role="checkbox" aria-checked="'+(on?"true":"false")+'" '+checkAttrs+' aria-label="Spunta '+esc(ex.name)+'">'+(on?"✓":"")+'</button>'
    + '<div class="body"><div class="name">'+esc(ex.name)+'</div>'
    + '<div class="schema">'+esc(it.schema)+'</div>'
    + '<ul class="cues">'+cues+'</ul>'
    + '<div class="equip">Attrezzatura: Nessuna</div>'
    + '<button class="btn btn-ghost sm play" data-act="anim" data-ref="'+it.ref+'">▶ Esecuzione</button>'
    + '</div></li>';
}

  var fatto=done[isoT]===tipo && sessTypeForDate(today())===tipo;
  var bar=h('<div style="position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));z-index:35;max-width:520px;margin:0 auto;padding:10px 16px calc(10px);background:rgba(251,250,247,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)">'

/* ---------- 7d) RENDER: Progressi ---------- */
function renderProgressi(){
  var v=document.getElementById("view-progressi");
  var cur=currentWeight(), delta=cur-settings.targetW;
  var dCls=delta>0?"neg":"pos";
  var dTxt=delta>0?("+"+delta.toFixed(1)+" kg dall'obiettivo"):(delta<0?(delta.toFixed(1)+" kg (sotto 88)"):"obiettivo raggiunto");

  var html='<div class="card"><div class="small muted" style="font-weight:600">Peso attuale</div>'
    + '<div class="bigweight num">'+cur.toFixed(1)+' <span style="font-size:1rem;color:var(--ink-soft)">kg</span></div>'
    + '<div class="delta '+dCls+'">'+dTxt+'</div>'
    + '<div class="inline-fields" style="margin-top:10px">'
    + '<div class="field"><label for="wIn">Aggiungi peso di oggi</label><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="'+cur.toFixed(1)+'"></div>'
    + '<div style="display:flex;align-items:flex-end"><button class="btn btn-primary sm" data-act="addWeight" style="width:auto;height:44px;padding:0 16px">Salva</button></div>'
    + '</div>'
    + '<div class="field"><label for="startW">Peso di partenza</label><input id="startW" type="number" inputmode="decimal" step="0.1" value="'+settings.startW+'"></div>'
    + '</div>';

  // Grafico peso
  html+='<div class="card"><div class="small muted" style="font-weight:600;margin-bottom:8px">Andamento peso · fascia obiettivo 87–89</div>'
    + '<div class="chartwrap">'+weightChartSVG()+'</div></div>';

  // Proiezione David
  html+='<div class="card"><div class="small muted" style="font-weight:600;margin-bottom:6px">Proiezione fisico "David"</div>'
    + '<div class="david-trio">'
    + '<figure>'+davidSVG(0,60)+'<figcaption>Partenza</figcaption></figure>'
    + '<figure>'+davidSVG(0.5,60)+'<figcaption>Metà</figcaption></figure>'
    + '<figure>'+davidSVG(1,60)+'<figcaption>Obiettivo</figcaption></figure>'
    + '</div>'
    + '<div class="david-stage"><div class="david-main" id="davMain">'+davidSVG(davProgress(),150)+'</div></div>'
    + '<div class="stagecap" id="davCap"></div>'
    + '<input type="range" id="davSlider" min="0" max="100" value="'+Math.round(davProgress()*100)+'" aria-label="Trasformazione">'
    + '<div class="btn-row" style="margin-top:6px">'
    + '<button class="btn btn-ghost sm" data-act="davSet" data-t="now">Tu adesso</button>'
    + '<button class="btn btn-ghost sm" data-act="davSet" data-t="mid">Metà</button>'
    + '<button class="btn btn-ghost sm" data-act="davSet" data-t="goal">Obiettivo</button></div>'
    + '<div class="readout"><div><div class="v num" id="davFat">–</div><div class="k">% grasso (stima)</div></div>'
    + '<div><div class="v num" id="davKg">–</div><div class="k">kg indicativi</div></div></div>'
    + '<p class="honesty">Modello illustrato e indicativo: non è una foto né una previsione medica. "Tu adesso" deriva dal peso registrato.</p>'
    + '</div>';

  // Mini-stat aderenza + streak
  html+='<div class="stats"><div class="stat"><div class="v num">'+adherence()+'%</div><div class="k">aderenza (4 sett.)</div></div>'
    + '<div class="stat"><div class="v num">'+streakWeeks()+'</div><div class="k">settimane di fila</div></div></div>';

  // Sicurezza dati
  html+='<div class="card"><h3 style="font-size:1rem;margin-bottom:8px">Sicurezza dati</h3>'
    + '<div class="btn-row"><button class="btn btn-ghost sm" data-act="backup">Esporta backup</button>'
    + '<button class="btn btn-ghost sm" data-act="importBtn">Importa backup</button></div>'
    + '<input id="importFile" type="file" accept="application/json,.json" class="hidden">'
    + '<button class="btn btn-danger sm" data-act="reset" style="width:100%;margin-top:8px">Azzera dati</button>'
    + '<p class="honesty">I dati restano solo su questo dispositivo'+(store.available?"":" (memoria temporanea: storage non disponibile)")+'. Nessun account, nessun server.</p>'
    + '</div>';

  v.innerHTML=html;
  updateDavReadout();

  // listener locali
  document.getElementById("startW").addEventListener("change",function(e){
    var val=parseFloat(e.target.value); if(!isNaN(val)&&val>0){ settings.startW=val; saveSettings(); renderProgressi(); }
  });
  document.getElementById("davSlider").addEventListener("input",function(e){
    var t=(+e.target.value)/100; document.getElementById("davMain").innerHTML=davidSVG(t,150); updateDavReadout(t);
  });
  document.getElementById("importFile").addEventListener("change",handleImportFile);
}
function davProgress(){
  var p=(settings.startW-currentWeight())/(settings.startW-settings.targetW);
  return Math.max(0,Math.min(1,isFinite(p)?p:0));
}
function updateDavReadout(t){
  if(t==null) t=(+ (document.getElementById("davSlider")||{value:davProgress()*100}).value)/100;
  var fat=(24 + (12.5-24)*t), kg=(settings.startW + (settings.targetW-settings.startW)*t);
  var fe=document.getElementById("davFat"), ke=document.getElementById("davKg"), ce=document.getElementById("davCap");
  if(fe) fe.textContent="~"+fat.toFixed(1)+"%";
  if(ke) ke.textContent="~"+kg.toFixed(1);
  if(ce) ce.textContent = t<0.34?"Partenza — si esce dal blocco" : (t<0.67?"Metà — la forma emerge" : "Obiettivo — il David");
}

/* Figure SVG articolate: gli arti sono <g> che ruotano attorno al giunto
   (transform-box:view-box, transform-origin in coordinate viewBox).
   La durata è parametrica: animation-duration: calc(var(--d) * var(--mult)). */
function animSVG(ref){
  switch(ref){
    case "crawl": return swimmer({supino:false, arms:"windmill", legs:"flutter", head:"side"});
    case "dorso": return swimmer({supino:true,  arms:"windmillRev", legs:"flutter", head:"up"});
    case "streamline": return swimmer({supino:false, arms:"stream", legs:"flutter", head:"down", bob:true});
    case "sculling": return swimmer({supino:false, arms:"scull", legs:"flutter", head:"down"});
    case "gambe": return swimmer({supino:false, arms:"stream", legs:"flutterBig", head:"down"});
    case "verticalkick": return verticalKick();
    case "spalle": return shoulderRolls();
    case "chintuck": return chinTuck();
    case "torace": return chestOpen();
    case "catcow": return catCow();
  }
  return "";
}

/* Nuotatore vista laterale (viewBox 0 0 240 130). Acqua a y=66. */
function swimmer(o){
  var waterY=66;
  var s='<svg viewBox="0 0 240 130" role="img" aria-label="Animazione nuotatore">';
  s+='<rect class="waterline" x="0" y="'+waterY+'" width="240" height="'+(130-waterY)+'"/>';
  s+='<path class="acc" style="fill:none;stroke-width:2;opacity:.5" d="M0 '+waterY+' q 15 -5 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0"/>';

  // gruppo corpo (eventuale bob verticale su streamline)
  var bobOpen = o.bob? '<g class="j a-bob" style="transform-origin:120px 60px">':'<g>';
  s+=bobOpen;

  // orientamento: supino = leggermente ruotato, pancia in su
  var bodyY = o.supino? 58 : 62;
  // tronco orizzontale
  s+='<line class="fig body" x1="70" y1="'+bodyY+'" x2="165" y2="'+(bodyY-2)+'"/>';
  // testa
  var hx=178, hy=(o.supino?bodyY-6:bodyY-1);
  s+='<circle class="skin" cx="'+hx+'" cy="'+hy+'" r="10"/>';

  // gambe: due cosce che sbattono attorno all'anca (x=72)
  var legDur = (o.legs==="flutterBig")?".42s":".55s";
  s+='<g class="j a-flutter" style="transform-origin:74px '+bodyY+'px;--d:'+legDur+'">'
    +'<line class="fig limb" x1="74" y1="'+bodyY+'" x2="40" y2="'+(bodyY+6)+'"/>'
    +'<line class="fig limb" x1="40" y1="'+(bodyY+6)+'" x2="18" y2="'+(bodyY+2)+'"/></g>';
  s+='<g class="j a-flutter-alt" style="transform-origin:74px '+bodyY+'px;--d:'+legDur+'">'
    +'<line class="fig limb" x1="74" y1="'+bodyY+'" x2="42" y2="'+(bodyY+12)+'"/>'
    +'<line class="fig limb" x1="42" y1="'+(bodyY+12)+'" x2="20" y2="'+(bodyY+16)+'"/></g>';

  // braccia attorno alla spalla (x=160)
  var shX=160, shY=bodyY-1;
  if(o.arms==="windmill"||o.arms==="windmillRev"){
    var cls=o.arms==="windmill"?"a-windmill":"a-windmill-rev";
    s+='<g class="j '+cls+'" style="transform-origin:'+shX+'px '+shY+'px;--d:1.8s">'
      +'<line class="fig limb" x1="'+shX+'" y1="'+shY+'" x2="'+(shX+26)+'" y2="'+shY+'"/></g>';
    s+='<g class="j '+cls+'" style="transform-origin:'+shX+'px '+shY+'px;--d:1.8s;animation-delay:-.9s">'
      +'<line class="fig limb" x1="'+shX+'" y1="'+shY+'" x2="'+(shX+26)+'" y2="'+shY+'"/></g>';
  } else if(o.arms==="scull"){
    // braccia avanti, avambracci che fanno "otto" (oscillano)
    s+='<line class="fig limb" x1="'+shX+'" y1="'+shY+'" x2="'+(shX+20)+'" y2="'+(shY+2)+'"/>';
    s+='<g class="j a-scull" style="transform-origin:'+(shX+20)+'px '+(shY+2)+'px;--d:1s">'
      +'<line class="fig limb" x1="'+(shX+20)+'" y1="'+(shY+2)+'" x2="'+(shX+40)+'" y2="'+(shY+2)+'"/></g>';
  } else { // stream: braccia distese oltre la testa
    s+='<line class="fig limb" x1="'+shX+'" y1="'+shY+'" x2="215" y2="'+(shY-2)+'"/>';
  }

  s+='</g></svg>';
  return s;
}

/* Vertical kicking: corpo verticale, braccia incrociate, gambe alternate. */

/* A secco — Cat-Cow: quadrupedia, colonna che morfa (SMIL <animate> su d).
   Rispetta prefers-reduced-motion (SMIL fermato via media query? SMIL non lo
   rispetta: forniamo comunque un morph lento e ampio comodo). */
function catCow(){
  var round="M55 70 Q100 48 150 68";   // gatto (arrotondata verso l'alto)
  var arch ="M55 74 Q100 92 150 72";   // mucca (dolcemente inarcata)
  var mid  ="M55 72 Q100 70 150 70";
  var s='<svg viewBox="0 0 200 130" role="img" aria-label="Animazione cat-cow">';
  // arti (quadrupedia)
  s+='<line class="fig limb" x1="60" y1="72" x2="58" y2="112"/>';
  s+='<line class="fig limb" x1="66" y1="72" x2="70" y2="112"/>';
  s+='<line class="fig limb" x1="145" y1="70" x2="142" y2="112"/>';
  s+='<line class="fig limb" x1="150" y1="70" x2="156" y2="112"/>';
  s+='<circle class="skin" cx="158" cy="58" r="11"/>';                      // testa
  // colonna che morfa
  s+='<path class="fig body" d="'+mid+'">'
    +'<animate attributeName="d" dur="3.2s" repeatCount="indefinite" '
    +'values="'+arch+';'+round+';'+arch+'" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></path>';
  return s+'</svg>';
}

/* ---------- 10) FIGURA "DAVID" (silhouette morphabile) ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function davidSVG(t, h){
  // larghezze interpolate: partenza (pancia, vita larga) → obiettivo (V-taper)
  var SH=lerp(30,34,t);       // spalle
  var CH=lerp(27,30,t);       // petto
  var WA=lerp(25,17,t);       // vita (si assottiglia)
  var HI=lerp(27,23,t);       // anche
  var cx=60;
  function P(w,y){ return (cx-w)+" "+y; }
  // contorno destro/sinistro
  var d="M "+P(-8,44)                         // collo dx
    +" L "+P(-SH,54)                            // spalla dx
    +" Q "+P(-CH-2,66)+" "+P(-CH,78)            // petto dx
    +" Q "+P(-WA-3,92)+" "+P(-WA,100)           // vita dx
    +" L "+P(-HI,116)                           // anca dx
    +" L "+P(-13,150)                           // coscia dx
    +" L "+P(-11,196)                           // gamba dx
    +" L "+P(-2,196)                            // interno dx
    +" L "+P(-3,150)
    +" L "+P(3,150)                             // interno sx (mirror)
    +" L "+P(2,196)
    +" L "+P(11,196)
    +" L "+P(13,150)
    +" L "+P(HI,116)
    +" L "+P(WA,100)
    +" Q "+P(WA+3,92)+" "+P(CH,78)
    +" Q "+P(CH+2,66)+" "+P(SH,54)
    +" L "+P(8,44) +" Z";
  var s='<svg viewBox="0 0 120 210" role="img" aria-label="Proiezione fisico"'+(h?' style="max-height:'+h+'px"':'')+'>';
  // testa
  s+='<circle class="davfill" cx="'+cx+'" cy="30" r="13"/>';
  // ombra pancia (svanisce con t)
  var shadowOp=lerp(.32,0,t);
  s+='<ellipse cx="'+cx+'" cy="94" rx="'+lerp(15,9,t)+'" ry="12" fill="#8f887a" opacity="'+shadowOp.toFixed(2)+'"/>';
  // corpo
  s+='<path class="davfill" d="'+d+'"/>';
  // braccia (lungo i fianchi)
  s+='<path class="davfill" d="M '+(cx-SH+1)+' 56 q -10 22 -8 44"/>';
  s+='<path class="davfill" d="M '+(cx+SH-1)+' 56 q 10 22 8 44"/>';
  s+='<line stroke="#a89f8e" stroke-width="4" stroke-linecap="round" x1="'+(cx-SH+1)+'" y1="56" x2="'+(cx-SH-6)+'" y2="100"/>';
  s+='<line stroke="#a89f8e" stroke-width="4" stroke-linecap="round" x1="'+(cx+SH-1)+'" y1="56" x2="'+(cx+SH+6)+'" y2="100"/>';
  // linee di definizione (compaiono con t): addome + V-taper
  var defOp=Math.max(0,(t-0.35)/0.65);
  s+='<g stroke="#8f887a" stroke-width="1.6" fill="none" opacity="'+defOp.toFixed(2)+'" stroke-linecap="round">';
  s+='<line x1="'+cx+'" y1="80" x2="'+cx+'" y2="112"/>';                    // linea alba
  s+='<line x1="'+(cx-8)+'" y1="86" x2="'+(cx+8)+'" y2="86"/>';
  s+='<line x1="'+(cx-8)+'" y1="94" x2="'+(cx+8)+'" y2="94"/>';
  s+='<path d="M '+(cx-WA)+' 104 L '+(cx-6)+' 120"/>';                      // V-taper dx
  s+='<path d="M '+(cx+WA)+' 104 L '+(cx+6)+' 120"/>';                      // V-taper sx
  s+='<path d="M '+(cx-CH)+' 70 Q '+cx+' 76 '+(cx+CH)+' 70"/>';            // pettorali
  s+='</g>';
  return s+'</svg>';
}

/* ---------- Grafico peso (SVG) ---------- */
function weightChartSVG(){
  var W=340, H=170, padL=30, padR=10, padT=12, padB=22;
  var lo=settings.low, hi=settings.high;
  // raccogli dati (peso + partenza come primo punto se nessun dato)
  var data = weights.slice();
  if(data.length===0) data=[{date:iso(today()),kg:settings.startW}];
  // range Y
  var vals=data.map(function(d){return d.kg;}).concat([settings.targetW, lo, hi, settings.startW]);
  var minV=Math.min.apply(null,vals)-1, maxV=Math.max.apply(null,vals)+1;
  function X(i){ return padL + (data.length<=1?0:(i/(data.length-1)))*(W-padL-padR); }
  function Y(v){ return padT + (1-(v-minV)/(maxV-minV))*(H-padT-padB); }

  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico peso">';
  // fascia obiettivo 87-89
  s+='<rect x="'+padL+'" y="'+Y(hi)+'" width="'+(W-padL-padR)+'" height="'+(Y(lo)-Y(hi))+'" fill="rgba(92,113,80,.16)"/>';
  // linea 88 tratteggiata
  s+='<line x1="'+padL+'" y1="'+Y(settings.targetW)+'" x2="'+(W-padR)+'" y2="'+Y(settings.targetW)+'" stroke="var(--verde)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<text x="'+(W-padR)+'" y="'+(Y(settings.targetW)-4)+'" text-anchor="end" font-size="10" fill="var(--verde)">88</text>';
  // assi labels
  s+='<text x="4" y="'+(Y(maxV-1)+3)+'" font-size="9" fill="#9a927f">'+Math.round(maxV-1)+'</text>';
  s+='<text x="4" y="'+(Y(minV+1)+3)+'" font-size="9" fill="#9a927f">'+Math.round(minV+1)+'</text>';
  // linea peso
  if(data.length>1){
    var pts=data.map(function(d,i){ return X(i)+","+Y(d.kg); }).join(" ");
    s+='<polyline points="'+pts+'" fill="none" stroke="var(--bronze)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  data.forEach(function(d,i){ s+='<circle cx="'+X(i)+'" cy="'+Y(d.kg)+'" r="3" fill="var(--bronze)"/>'; });
  // etichetta ultimo punto
  var last=data[data.length-1];
  s+='<text x="'+X(data.length-1)+'" y="'+(Y(last.kg)-7)+'" text-anchor="end" font-size="10" fill="var(--ink)" font-weight="600">'+last.kg.toFixed(1)+'</text>';
  return s+'</svg>';
}

/* ---------- 11) EVENTI (delegation) & AZIONI ---------- */
document.addEventListener("click", function(e){
  // chiusura sheet
  var closeT=e.target.closest("[data-close]");
  if(closeT){ if(closeT.dataset.close==="prev") closePreview(); else closeAnim(); return; }

  var el=e.target.closest("[data-act],[data-tab]");
  if(!el) return;
  var act=el.dataset.act;

  if(el.dataset.tab){ setTab(el.dataset.tab); return; }

  switch(act){
    case "goSession":
      sessionType=el.dataset.tipo||sessTypeForDate(today())||"A";
      setTab("sessione"); break;
    case "preview":
      openPreview(el.dataset.tipo||null, el.dataset.date||null); break;
    case "week":
      planOffset+=(+el.dataset.dir); renderPiano(); break;
    case "toggleDone":
      if(el.dataset.tipo){ toggleDone(el.dataset.date, el.dataset.tipo); renderPiano(); } break;
    case "segSess":
      sessionType=el.dataset.tipo; clearSessSticky(); renderSessione(); break;
    case "toggleEx":
      toggleEx(el.dataset.date, el.dataset.tipo, el.dataset.id); renderSessione(); break;
    case "completeToday":
      toggleDone(iso(today()), el.dataset.tipo); renderSessione(); break;
    case "anim":
      openAnim(el.dataset.ref); break;
    case "slow":
      animSlow=!animSlow; renderAnim(); break;
    case "pvSet": {
      var wd = prevCtx.dateISO? weekdayMon(parseISO(prevCtx.dateISO)) : null;
      // se aperto senza data (es. da Oggi) non c'è un giorno-settimana da cambiare
      if(wd===null){ /* niente pattern da toccare */ }
      var nt=el.dataset.tipo;
      if(wd!==null){
        if(nt==="R") delete pattern[wd]; else pattern[wd]=nt;
        savePattern();
      }
      prevCtx.tipo = (nt==="R")? null : nt;
      renderPreview();
      // riflette nelle viste sotto
      if(activeTab==="piano") renderPiano(); else if(activeTab==="oggi") renderOggi();
      break;
    }
    case "pvDone":
      toggleDone(prevCtx.dateISO, prevCtx.tipo); renderPreview();
      if(activeTab==="piano") renderPiano(); else if(activeTab==="oggi") renderOggi();
      break;
    case "exportICS":
      downloadFile("david-nuoto.ics","text/calendar",buildICS()); break;
    case "addWeight": {
      var inp=document.getElementById("wIn"); var val=parseFloat(inp.value);
      if(!isNaN(val)&&val>0&&val<300){ addWeight(val); renderProgressi(); }
      break;
    }
    case "davSet": {
      var t = el.dataset.t==="mid"?0.5 : el.dataset.t==="goal"?1 : davProgress();
      var sl=document.getElementById("davSlider"); sl.value=Math.round(t*100);
      document.getElementById("davMain").innerHTML=davidSVG(t,150); updateDavReadout(t);
      break;
    }
    case "backup": exportBackup(); break;
    case "importBtn": document.getElementById("importFile").click(); break;
    case "reset": doReset(); break;
  }
});

function addWeight(kg){
  var d=iso(today());
  // sostituisci se già registrato oggi, altrimenti aggiungi e riordina
  var found=false;
  for(var i=0;i<weights.length;i++){ if(weights[i].date===d){ weights[i].kg=kg; found=true; break; } }
  if(!found) weights.push({date:d,kg:kg});
  weights.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  saveWeights();
}

/* ---------- Backup / Import / Reset ---------- */
function exportBackup(){
  var dump={schemaVersion:SCHEMA, settings:settings, pattern:pattern, done:done, exchecks:exchecks, weights:weights};
  downloadFile("david-backup.json","application/json",JSON.stringify(dump,null,2));
}
function handleImportFile(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(obj.settings) settings=Object.assign(settings,obj.settings);
      if(obj.pattern)  pattern=obj.pattern;
      if(obj.done)     done=Object.assign({},done,obj.done);
      if(obj.exchecks) exchecks=Object.assign({},exchecks,obj.exchecks);
      if(Array.isArray(obj.weights)) weights=obj.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});
      settings.schemaVersion=SCHEMA;
      saveSettings(); savePattern(); saveDone(); saveExchecks(); saveWeights();
      renderTab(activeTab);
      alert("Backup importato correttamente.");
    }catch(err){ alert("File non valido: "+err.message); }
  };
  r.readAsText(f);
  e.target.value="";
}
function doReset(){
  if(!confirm("Azzerare tutti i dati? L'operazione non è reversibile.")) return;
  Object.keys(KEYS).forEach(function(k){ store.del(KEYS[k]); });
  loadState(); sessionType=null; planOffset=0; clearSessSticky();
  setTab("oggi");
  alert("Dati azzerati.");
}

/* quando lascio la scheda Sessione, rimuovo la barra sticky */
(function(){
  var _setTab=setTab;
  setTab=function(name){ if(name!=="sessione") clearSessSticky(); _setTab(name); };
})();

/* ---------- 12) INIT ---------- */
function init(){
  loadState();
  // migrazione schema (semplice): se manca schemaVersion, allineo
  if(settings.schemaVersion!==SCHEMA){ settings.schemaVersion=SCHEMA; saveSettings(); }
  document.querySelectorAll("#tabbar button").forEach(function(b){
    b.addEventListener("click",function(){ /* gestito da delegation */ });
  });
  setTab("oggi");
}
document.addEventListener("DOMContentLoaded", init);
</script>
