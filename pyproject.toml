[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btcmon"
version = "0.1.0"
description = "Monitoraggio e previsione del prezzo di Bitcoin basata su fattori macro e crypto"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
btcmon = "btcmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btcmon = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
