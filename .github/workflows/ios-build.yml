name: iOS build (David)

# Compila l'app nativa iOS su un runner macOS (Xcode), per verificare che il
# progetto Swift costruisca davvero. Non richiede firma (build per Simulatore).
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # macOS 15 porta Xcode 16, che supporta il formato progetto generato da XcodeGen.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versioni
        run: |
          xcodebuild -version
          swift --version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: native
        run: xcodegen generate

      - name: Compila (Simulatore iOS, senza firma)
        working-directory: native
        run: |
          xcodebuild \
            -project David.xcodeproj \
            -target David \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
