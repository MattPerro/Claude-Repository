name: iOS build (David)

# Compila l'app iOS + Watch e ESEGUE i test su un runner macOS (Xcode).
# Non richiede firma (build/test per Simulatore).
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # macOS 15 porta Xcode 16, che supporta il formato progetto generato da XcodeGen.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versioni
        run: |
          xcodebuild -version
          swift --version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: native
        run: xcodegen generate

      - name: Test iOS (compila app + esegue i test unitari)
        working-directory: native
        run: |
          xcodebuild \
            -project David.xcodeproj \
            -scheme David \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build app Watch
        working-directory: native
        run: |
          xcodebuild \
            -project David.xcodeproj \
            -scheme DavidWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
