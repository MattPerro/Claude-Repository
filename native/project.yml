# XcodeGen — genera David.xcodeproj a partire da questo file.
# Sul Mac:  brew install xcodegen  &&  cd native  &&  xcodegen generate
name: David
options:
  bundleIdPrefix: com.mattia.david
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <-- imposta il tuo Team di firma in Xcode (Signing & Capabilities)
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.9"
targets:
  David:
    type: application
    platform: iOS
    sources:
      - path: David
    settings:
      base:
        INFOPLIST_FILE: David/Info.plist
        CODE_SIGN_ENTITLEMENTS: David/David.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mattia.david
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
    entitlements:
      path: David/David.entitlements
    # HealthKit va aggiunto anche come Capability in Xcode (Signing & Capabilities → + HealthKit)
