# XcodeGen — genera David.xcodeproj a partire da questo file.
# Sul Mac:  brew install xcodegen  &&  cd native  &&  xcodegen generate
name: David
options:
  bundleIdPrefix: com.mattia.david
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <-- imposta il tuo Team di firma in Xcode (Signing & Capabilities)
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.9"
targets:
  # App iPhone
  David:
    type: application
    platform: iOS
    sources:
      - path: David
    settings:
      base:
        INFOPLIST_FILE: David/Info.plist
        CODE_SIGN_ENTITLEMENTS: David/David.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mattia.david
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
    # HealthKit va aggiunto anche come Capability in Xcode (Signing & Capabilities → + HealthKit)

  # Test unitari (logica di dominio)
  DavidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DavidTests
    dependencies:
      - target: David
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattia.david.tests
        GENERATE_INFOPLIST_FILE: YES

  # App Apple Watch (avvio nuotata dal polso)
  DavidWatch:
    type: application
    platform: watchOS
    sources:
      - path: DavidWatch
    settings:
      base:
        INFOPLIST_FILE: DavidWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: DavidWatch/DavidWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mattia.david.watch
        TARGETED_DEVICE_FAMILY: "4"   # Apple Watch

schemes:
  David:
    build:
      targets:
        David: all
    test:
      targets:
        - DavidTests
  DavidWatch:
    build:
      targets:
        DavidWatch: all
